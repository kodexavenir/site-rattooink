name: Inject RattooInk premium visual layer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inject-rattoo-premium-style.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add visual stylesheet link
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          marker = '<link rel="stylesheet" href="rattoo-premium.css">'

          if marker not in html:
              if '</head>' not in html:
                  raise SystemExit('index.html: </head> introuvable')
              html = html.replace('</head>', f'    {marker}\n</head>', 1)
              p.write_text(html, encoding='utf-8')
              print('Visual stylesheet link injected.')
          else:
              print('Visual stylesheet link already present.')
          PY

      - name: Commit visual injection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No change required.'
            exit 0
          fi
          git commit -m 'feat(ui): wire premium visual stylesheet'
          git push
