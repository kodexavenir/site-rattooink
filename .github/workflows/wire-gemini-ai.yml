name: Verify RattooInk Gemini AI Lab

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'ai-lab.js'
      - '.github/workflows/wire-gemini-ai.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'ai-lab.js'
      - '.github/workflows/wire-gemini-ai.yml'

permissions:
  contents: read

jobs:
  verify-ai-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify serverless endpoint exists
        run: test -f api/generate.js

      - name: Verify legacy endpoint remains an alias
        run: grep -q "export { default } from './generate.js';" api/generate-image.js

      - name: Verify browser client uses server endpoint
        run: grep -q "fetch('/api/generate'" ai-lab.js

      - name: Verify no obvious API key is committed
        shell: bash
        run: |
          if grep -RniE 'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,}' api ai-lab.js; then
            echo 'Possible API key detected in committed AI files.'
            exit 1
          fi
