name: Wire RattooInk Gemini AI Lab

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-gemini-ai.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Gemini endpoint and client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p api

          cat > api/generate-image.js <<'EOF'
          export default async function handler(req, res) {
            if (req.method !== 'POST') {
              res.setHeader('Allow', 'POST');
              return res.status(405).json({ error: 'Méthode non autorisée.' });
            }

            const apiKey = process.env.GEMINI_API_KEY;
            if (!apiKey) {
              return res.status(500).json({
                error: 'GEMINI_API_KEY n’est pas configurée dans Vercel. Ajoute-la dans Project Settings → Environment Variables.'
              });
            }

            try {
              const body = typeof req.body === 'string' ? JSON.parse(req.body) : (req.body || {});
              const userPrompt = String(body.prompt || '').trim();
              if (!userPrompt) return res.status(400).json({ error: 'Décris ton projet de tatouage.' });
              if (userPrompt.length > 1500) return res.status(400).json({ error: 'Description trop longue. Limite : 1500 caractères.' });

              const prompt = [
                'Tu es l’outil de conception visuelle officiel de RattooInk.',
                'Génère un concept de tatouage original à partir de la demande du client.',
                'Le rendu doit être pensé comme une planche de concept de tatouage professionnelle, lisible par une tatoueuse.',
                'Privilégie un fond blanc ou neutre, une composition claire, un dessin propre et un contraste élevé.',
                'Ne montre pas de corps humain tatoué, sauf si le client demande explicitement une simulation de placement.',
                'N’ajoute ni logo, ni watermark, ni signature, ni texte parasite.',
                'Conserve fidèlement le sujet, le style et les éléments demandés.',
                `Demande du client : ${userPrompt}`
              ].join('\n\n');

              const response = await fetch('https://generativelanguage.googleapis.com/v1beta/interactions', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-goog-api-key': apiKey
                },
                body: JSON.stringify({
                  model: 'gemini-3.1-flash-image',
                  input: prompt
                })
              });

              const data = await response.json();
              if (!response.ok) {
                console.error('Gemini API error', data);
                return res.status(response.status).json({ error: data?.error?.message || 'Gemini n’a pas pu générer l’image.' });
              }

              let image = data?.output_image;
              if (!image && Array.isArray(data?.steps)) {
                for (const step of data.steps) {
                  for (const block of (step?.content || [])) {
                    if (block?.type === 'image' && block?.data) {
                      image = block;
                      break;
                    }
                  }
                  if (image) break;
                }
              }

              if (!image?.data) {
                return res.status(502).json({ error: 'Gemini a répondu sans image exploitable.' });
              }

              const mimeType = image.mime_type || image.mimeType || 'image/png';
              return res.status(200).json({
                imageDataUrl: `data:${mimeType};base64,${image.data}`
              });
            } catch (error) {
              console.error(error);
              return res.status(500).json({ error: 'Erreur serveur pendant la génération.' });
            }
          }
          EOF

          cat > ai-lab.js <<'EOF'
          (() => {
            const input = document.getElementById('ai-prompt');
            const button = document.getElementById('generate-btn');
            const resultArea = document.getElementById('ai-result-area');
            const loading = document.getElementById('ai-loading');
            const imageContainer = document.getElementById('ai-image-container');
            const generatedImg = document.getElementById('ai-generated-img');
            const errorBox = document.getElementById('ai-error');
            const errorText = document.getElementById('ai-error-text');

            if (!input || !button || !resultArea || !loading || !imageContainer || !generatedImg || !errorBox || !errorText) return;

            function setState(state) {
              resultArea.classList.remove('hidden');
              resultArea.classList.add('flex');
              loading.classList.toggle('hidden', state !== 'loading');
              loading.classList.toggle('flex', state === 'loading');
              imageContainer.classList.toggle('hidden', state !== 'image');
              errorBox.classList.toggle('hidden', state !== 'error');
              errorBox.classList.toggle('flex', state === 'error');
            }

            async function generate() {
              const prompt = input.value.trim();
              if (!prompt) {
                errorText.textContent = 'Décris d’abord ton projet de tatouage.';
                setState('error');
                input.focus();
                return;
              }

              button.disabled = true;
              button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Création…';
              setState('loading');

              try {
                const response = await fetch('/api/generate-image', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ prompt })
                });
                const data = await response.json();
                if (!response.ok || !data.imageDataUrl) throw new Error(data.error || 'Génération impossible.');

                generatedImg.src = data.imageDataUrl;
                generatedImg.alt = `Concept RattooInk — ${prompt}`;
                setState('image');
              } catch (error) {
                errorText.textContent = error instanceof Error ? error.message : 'Une erreur est survenue.';
                setState('error');
              } finally {
                button.disabled = false;
                button.innerHTML = '<i class="fas fa-bolt"></i> Créer';
              }
            }

            button.addEventListener('click', generate);
            input.addEventListener('keydown', (event) => {
              if (event.key === 'Enter') {
                event.preventDefault();
                generate();
              }
            });
          })();
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          marker = '<script src="/ai-lab.js"></script>'
          if marker not in html:
              html = html.replace('</body>', f'    {marker}\n</body>')
              p.write_text(html, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ai-lab.js api/generate-image.js
          git diff --cached --quiet && exit 0
          git commit -m 'feat: make RattooInk AI lab generate tattoo concepts with Gemini'
          git push